# Wi-Fi configuration (sourced by wifi_apply.sh as strict shell KEY=value).
#
# Credentials are NOT stored in this file. They live in secrets.conf, which is
# .gitignored — copy secrets.conf.template -> secrets.conf and fill it in.
#
# MODE:
#   - sta:  connect to an existing Wi-Fi network
#   - none: do nothing (leave networking to stock firmware)
#
# SECURITY (for sta): 1=open, 2=wep, 3=wpa/wpa2

MODE=sta
SECURITY=3
DHCP=1

# Pull SSID/PASS from the gitignored secrets file. CUSTOM_DIR is set by the
# caller (wifi_apply.sh) before this file is sourced.
if [ -f "${CUSTOM_DIR}/configs/secrets.conf" ]; then
    # shellcheck disable=SC1090
    . "${CUSTOM_DIR}/configs/secrets.conf"
fi
SSID="${WIFI_SSID}"
PASS="${WIFI_PASS}"
